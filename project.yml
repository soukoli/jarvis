# xcodegen spec. `xcodegen generate` produces Jarvis.xcodeproj (git-ignored).
name: Jarvis
options:
  bundleIdPrefix: com.sap
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  JarvisCore:
    path: Core

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O

targets:
  Jarvis:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
    dependencies:
      - package: JarvisCore
        product: JarvisCore
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Jarvis
        CFBundleDisplayName: SAP Jarvis
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Jarvis listens to your voice to turn it into text. Audio never leaves this Mac.
        NSHumanReadableCopyright: © 2026 SAP SE. Local, on-device dictation.
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: App/Jarvis.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.cs.disable-library-validation: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sap.jarvis
        PRODUCT_NAME: Jarvis
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        # Local builds: ad-hoc unless a team is configured (see scripts/build.sh).
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
